name: Worker syntax check

on:
  pull_request:
    paths:
      - "worker.js"
      - ".github/workflows/worker-syntax.yml"
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "worker.js"
      - ".github/workflows/worker-syntax.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check worker.js
